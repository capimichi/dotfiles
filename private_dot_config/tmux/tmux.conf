set -g mouse on

# Mantieni la directory corrente quando dividi lo schermo (scorciatoie native)
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Split diretto con Ctrl + Shift + V (verticale) e Ctrl + Shift + H (orizzontale) senza bisogno di prefisso
bind -n C-S-v split-window -h -c "#{pane_current_path}"
bind -n C-S-V split-window -h -c "#{pane_current_path}"
bind -n C-S-h split-window -v -c "#{pane_current_path}"
bind -n C-S-H split-window -v -c "#{pane_current_path}"

# Split con prefisso Ctrl + b (sia con Ctrl+Shift che solo con v/h)
bind C-S-v split-window -h -c "#{pane_current_path}"
bind C-S-h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# ==========================================
# TPM & Plugin di persistenza sessioni
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Opzioni tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Opzioni tmux-continuum (ripristino automatico e salvataggio ogni 10 min)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Inizializza TPM (deve rimanere all'ultima riga di tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
